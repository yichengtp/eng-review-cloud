<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexicon — 字彙複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAE6D9;
    --paper-deep: #E1DCC9;
    --card: #F6F3E9;
    --ink: #22303F;
    --ink-soft: #5B6672;
    --ink-faint: #8B8B7C;
    --rule: #C9C2AE;
    --stamp: #B0812A;
    --stamp-dark: #8C6420;
    --oxblood: #8C3B2E;
    --sage: #56724F;
    --shadow: rgba(34,48,63,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(34,48,63,0.05) 1px, transparent 0);
    background-size: 14px 14px;
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink); padding-bottom:10px; margin-bottom: 18px;
  }
  header.top h1{
    font-family:'Source Serif 4', serif; font-weight:700; font-size:26px; margin:0;
    letter-spacing: 0.01em;
  }
  header.top .sub{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-soft); letter-spacing:0.04em; }

  nav.tabs{ display:flex; gap:0; margin-bottom:22px; border-bottom: 1px solid var(--rule); }
  nav.tabs button{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.06em;
    background:none; border:none; padding:10px 4px; margin-right:22px; cursor:pointer;
    color: var(--ink-faint); border-bottom: 2px solid transparent; position:relative; top:1px;
  }
  nav.tabs button.active{ color: var(--ink); border-bottom-color: var(--oxblood); }
  nav.tabs .count{ background: var(--oxblood); color:#F6F3E9; border-radius:2px; padding:1px 5px; font-size:10px; margin-left:6px; }

  /* ---- Review card ---- */
  .stage{ display:flex; flex-direction:column; align-items:center; padding-top: 10px; }
  .index-card{
    width:100%; max-width: 420px; min-height: 260px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: 0 3px 0 var(--rule), 0 10px 24px var(--shadow);
    position: relative;
    padding: 30px 26px 26px;
    cursor: pointer;
    display:flex; flex-direction:column;
  }
  .index-card::before{
    content:""; position:absolute; top:16px; left:16px;
    width:10px; height:10px; border-radius:50%;
    background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }
  .box-tab{
    position:absolute; top:14px; right:-1px;
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:#F6F3E9;
    background: var(--stamp-dark); padding:3px 9px 3px 12px; border-radius: 3px 0 0 3px;
    letter-spacing:0.05em;
  }
  .card-word{
    font-family:'Source Serif 4', serif; font-weight:700; font-size: 34px;
    margin-top: 26px; text-align:center; color: var(--ink);
  }
  .card-hint{
    text-align:center; font-family:'IBM Plex Mono', monospace; font-size:10px;
    color: var(--ink-faint); margin-top:10px; letter-spacing:0.05em;
  }
  .card-divider{ border:none; border-top: 1px dashed var(--rule); margin: 18px 0; }
  .card-notes{
    font-size:16px; line-height:1.6; color: var(--ink-soft); text-align:center;
    min-height: 48px; white-space: pre-wrap;
  }
  .card-tags{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .tag{ font-family:'IBM Plex Mono', monospace; font-size:10px; color: var(--stamp-dark); border:1px solid var(--stamp); border-radius:10px; padding:2px 8px; }

  .review-actions{ display:flex; gap:14px; margin-top: 22px; width:100%; max-width:420px; }
  .stamp-btn{
    flex:1; font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.04em;
    padding: 13px 0; border-radius:3px; cursor:pointer; font-weight:600;
    border: 2px solid; background: transparent; transition: transform 0.08s ease;
  }
  .stamp-btn:active{ transform: scale(0.97) rotate(-1deg); }
  .stamp-btn.know{ color: var(--sage); border-color: var(--sage); }
  .stamp-btn.know:hover{ background: var(--sage); color: #F6F3E9; }
  .stamp-btn.unsure{ color: var(--oxblood); border-color: var(--oxblood); }
  .stamp-btn.unsure:hover{ background: var(--oxblood); color: #F6F3E9; }

  .empty{
    text-align:center; color: var(--ink-soft); padding: 60px 20px;
    font-family:'Source Serif 4', serif; font-size:18px; line-height:1.7;
  }
  .empty .sub2{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--ink-faint); margin-top:8px; }

  .progress-line{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-faint); margin-bottom:14px; letter-spacing:0.04em; }

  /* ---- Library / add ---- */
  .panel{
    background: var(--card); border:1px solid var(--rule); border-radius:3px;
    padding: 18px 18px 20px; margin-bottom: 20px;
  }
  .panel h2{ font-family:'Source Serif 4', serif; font-size:16px; margin:0 0 10px; }
  .panel p.hint{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-faint); margin: 0 0 10px; line-height:1.6; }
  textarea{
    width:100%; min-height: 110px; font-family:'IBM Plex Mono', monospace; font-size:13px;
    padding:10px; border:1px solid var(--rule); border-radius:2px; background: var(--paper);
    color: var(--ink); resize: vertical;
  }
  .add-row{ display:flex; justify-content:flex-end; margin-top:10px; gap:10px; align-items:center;}
  .toast-msg{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--sage); }
  button.primary{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.04em; font-weight:600;
    background: var(--ink); color:#F6F3E9; border:none; padding:10px 18px; border-radius:2px; cursor:pointer;
  }
  button.primary:hover{ background: var(--stamp-dark); }

  .lib-search{
    width:100%; font-family:'Inter'; font-size:13px; padding:8px 10px; margin-bottom:12px;
    border:1px solid var(--rule); border-radius:2px; background: var(--card); color:var(--ink);
  }
  ul.catalog{ list-style:none; margin:0; padding:0; }
  li.entry{
    border-bottom: 1px solid var(--rule); padding: 12px 4px; cursor:pointer;
  }
  li.entry:last-child{ border-bottom:none; }
  .entry-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .entry-word{ font-family:'Source Serif 4', serif; font-weight:600; font-size:17px; }
  .entry-meta{ font-family:'IBM Plex Mono', monospace; font-size:10px; color: var(--ink-faint); white-space:nowrap; }
  .entry-notes-preview{ font-size:13px; color: var(--ink-soft); margin-top:3px; }
  .entry-edit{ margin-top:10px; display:none; flex-direction:column; gap:8px; }
  li.entry.open .entry-edit{ display:flex; }
  .entry-edit input, .entry-edit textarea{
    font-family:'Inter'; font-size:13px; padding:7px 9px; border:1px solid var(--rule);
    border-radius:2px; background: var(--paper); color:var(--ink);
  }
  .entry-edit-actions{ display:flex; justify-content:space-between; align-items:center; }
  .del-btn{ font-family:'IBM Plex Mono', monospace; font-size:10px; color: var(--oxblood); background:none; border:none; cursor:pointer; letter-spacing:0.04em; }
  .save-btn{ font-family:'IBM Plex Mono', monospace; font-size:10px; color: var(--sage); background:none; border: 1px solid var(--sage); border-radius:2px; padding:5px 10px; cursor:pointer; }

  .due-soon{ color: var(--oxblood); }
  .due-mastered{ color: var(--sage); }

  @media (prefers-reduced-motion: reduce){ .stamp-btn{ transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Lexicon</h1>
    <div class="sub" id="dateLabel"></div>
  </header>
  <div class="sub" id="syncStatus" style="text-align:right;margin-top:-12px;margin-bottom:14px;"></div>

  <nav class="tabs">
    <button id="tabReview" class="active">複習 <span class="count" id="dueCount">0</span></button>
    <button id="tabLibrary">卡片庫 <span class="count" id="totalCount" style="background:var(--ink-faint)">0</span></button>
  </nav>

  <div id="viewReview"></div>
  <div id="viewLibrary" style="display:none"></div>
</div>

<script>
(function(){
  const DAY = 86400000;
  const INTERVALS = {1:0, 2:1*DAY, 3:3*DAY, 4:7*DAY, 5:14*DAY}; // box -> next interval

  let words = [];
  let reviewQueue = [];
  let currentIdx = 0;
  let flipped = false;

  const dateLabel = document.getElementById('dateLabel');
  dateLabel.textContent = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'2-digit', day:'2-digit'});

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // ---- Cloud sync config ----
  // Fill these in with your own jsonbin.io bin (see setup instructions).
  const JSONBIN_BIN_ID = '6a7f72d3f5f4af5e29178612';
  const JSONBIN_API_KEY = '$2a$10$lYqD8oQfpYkIXRNfIlFHnO2T1W6vcH17TzzEIAwWbbaVfD4IEdi72';
  const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;

function syncConfigured(){
    return JSONBIN_BIN_ID && JSONBIN_BIN_ID !== '6a7f72d3f5f4af5e29178612' &&
           JSONBIN_API_KEY && JSONBIN_API_KEY !== '$2a$10$lYqD8oQfpYkIXRNfIlFHnO2T1W6vcH17TzzEIAwWbbaVfD4IEdi72';
}
  
  async function loadWords(){
    // local cache first so the app is instant / works offline
    try{
      const raw = localStorage.getItem('lexicon:words');
      words = raw ? JSON.parse(raw) : [];
    }catch(e){
      words = [];
    }
    if(!syncConfigured()) return;
    try{
      setSyncStatus('同步中…');
      const res = await fetch(JSONBIN_BASE + '/latest', {
        headers: { 'X-Access-Key': JSONBIN_API_KEY }
      });
      if(!res.ok) throw new Error('fetch failed: ' + res.status);
      const data = await res.json();
      const record = data && data.record;
      const remote = (record && Array.isArray(record.words)) ? record.words : [];
      words = remote;
      localStorage.setItem('lexicon:words', JSON.stringify(words));
      setSyncStatus('已同步');
    }catch(e){
      console.error('cloud load failed', e);
      setSyncStatus('離線（使用本機資料）', true);
    }
  }

  async function saveWords(){
    try{
      localStorage.setItem('lexicon:words', JSON.stringify(words));
    }catch(e){
      console.error('local save failed', e);
    }
    if(!syncConfigured()) return;
    try{
      setSyncStatus('同步中…');
      const res = await fetch(JSONBIN_BASE, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Access-Key': JSONBIN_API_KEY },
        body: JSON.stringify({ words: words })
      });
      if(!res.ok) throw new Error('put failed: ' + res.status);
      setSyncStatus('已同步');
    }catch(e){
      console.error('cloud save failed', e);
      setSyncStatus('同步失敗（已存本機）', true);
    }
  }

  function makeWord(word, notes){
    return {
      id: uid(),
      word: word,
      notes: notes || '',
      tags: [],       // room for expansion: free-form categorization
      extra: {},       // room for expansion: future fields (e.g. example sentences, audio, source)
      box: 1,
      dueAt: Date.now(),
      createdAt: Date.now(),
      reviewCount: 0
    };
  }

  function parseAndAdd(raw){
    const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
    let added = 0, skipped = 0, merged = 0;
    let lastAdded = null;
    lines.forEach(line => {
      // continuation line (e.g. "-be radiant with sth") gets appended to the
      // previous word's notes instead of becoming its own broken entry
      if(/^-\s*/.test(line)){
        if(lastAdded){
          lastAdded.notes = (lastAdded.notes ? lastAdded.notes + '\n' : '') + line.replace(/^-\s*/, '· ');
          merged++;
        }
        return;
      }
      const m = line.match(/^(\S+)\s*(.*)$/);
      if(!m) return;
      const wordText = m[1];
      const notes = m[2] || '';
      const exists = words.some(w => w.word.toLowerCase() === wordText.toLowerCase());
      if(exists){ skipped++; lastAdded = words.find(w => w.word.toLowerCase() === wordText.toLowerCase()); return; }
      const w = makeWord(wordText, notes);
      words.push(w);
      lastAdded = w;
      added++;
    });
    return {added, skipped, merged};
  }

  function dueWords(){
    const now = Date.now();
    return words.filter(w => w.dueAt <= now);
  }

  function fmtDue(w){
    const now = Date.now();
    if(w.dueAt <= now) return {text:'待複習', cls:'due-soon'};
    const days = Math.ceil((w.dueAt - now) / DAY);
    if(w.box >= 5) return {text: days + '天後 · 已熟', cls:'due-mastered'};
    return {text: days + '天後', cls:''};
  }

  function renderTabs(){
    document.getElementById('dueCount').textContent = dueWords().length;
    document.getElementById('totalCount').textContent = words.length;
  }

  // ---------- Review view ----------
  function startReviewSession(){
    reviewQueue = dueWords().sort(() => Math.random() - 0.5);
    currentIdx = 0;
    flipped = false;
    renderReview();
  }

  function renderReview(){
    const el = document.getElementById('viewReview');
    renderTabs();
    if(reviewQueue.length === 0){
      el.innerHTML = `<div class="empty">目前沒有待複習的字<div class="sub2">加入新字後會立即進入複習佇列</div></div>`;
      return;
    }
    if(currentIdx >= reviewQueue.length){
      el.innerHTML = `<div class="empty">今天的複習完成了 ✓<div class="sub2">共複習 ${reviewQueue.length} 張卡片</div></div>`;
      return;
    }
    const w = reviewQueue[currentIdx];
    const tagsHtml = (w.tags && w.tags.length) ? `<div class="card-tags">${w.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : '';
    el.innerHTML = `
      <div class="progress-line">${currentIdx + 1} / ${reviewQueue.length}</div>
      <div class="stage">
        <div class="index-card" id="flipCard">
          <div class="box-tab">BOX ${w.box}</div>
          <div class="card-word">${escapeHtml(w.word)}</div>
          <div class="card-hint">${flipped ? '' : '點卡片顯示筆記'}</div>
          ${flipped ? `<hr class="card-divider"><div class="card-notes">${escapeHtml(w.notes) || '（無筆記）'}</div>${tagsHtml}` : ''}
        </div>
        <div class="review-actions" style="visibility:${flipped ? 'visible' : 'hidden'}">
          <button class="stamp-btn unsure" id="btnUnsure">不熟</button>
          <button class="stamp-btn know" id="btnKnow">熟悉</button>
        </div>
      </div>
    `;
    document.getElementById('flipCard').onclick = () => { flipped = true; renderReview(); };
    if(flipped){
      document.getElementById('btnKnow').onclick = (e) => { e.stopPropagation(); grade(w, true); };
      document.getElementById('btnUnsure').onclick = (e) => { e.stopPropagation(); grade(w, false); };
    }
  }

  async function grade(w, know){
    w.reviewCount++;
    if(know){
      w.box = Math.min(5, w.box + 1);
    } else {
      w.box = 1;
    }
    w.dueAt = Date.now() + (INTERVALS[w.box] || 0);
    await saveWords();
    currentIdx++;
    flipped = false;
    renderReview();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Library view ----------
  let openEntryId = null;
  let searchTerm = '';

  function renderLibrary(){
    const el = document.getElementById('viewLibrary');
    renderTabs();
    const filtered = words
      .filter(w => !searchTerm || w.word.toLowerCase().includes(searchTerm) || w.notes.toLowerCase().includes(searchTerm))
      .sort((a,b) => a.dueAt - b.dueAt);

    const listHtml = filtered.length ? filtered.map(w => {
      const due = fmtDue(w);
      const isOpen = openEntryId === w.id;
      return `
        <li class="entry ${isOpen ? 'open' : ''}" data-id="${w.id}">
          <div class="entry-row">
            <span class="entry-word">${escapeHtml(w.word)}</span>
            <span class="entry-meta ${due.cls}">BOX ${w.box} · ${due.text}</span>
          </div>
          ${w.notes ? `<div class="entry-notes-preview">${escapeHtml(w.notes)}</div>` : ''}
          <div class="entry-edit">
            <input type="text" data-field="word" value="${escapeHtml(w.word)}" placeholder="英文單字">
            <textarea data-field="notes" rows="2" placeholder="筆記">${escapeHtml(w.notes)}</textarea>
            <input type="text" data-field="tags" value="${escapeHtml((w.tags||[]).join(', '))}" placeholder="標籤（逗號分隔，選填）">
            <div class="entry-edit-actions">
              <button class="del-btn" data-action="delete">刪除這張卡</button>
              <button class="save-btn" data-action="save">儲存</button>
            </div>
          </div>
        </li>`;
    }).join('') : `<div class="empty" style="padding:30px 10px;">還沒有字卡<div class="sub2">在上面貼上單字清單開始</div></div>`;

    el.innerHTML = `
      <div class="panel">
        <h2>加入新字</h2>
        <p class="hint">每行一個：英文單字開頭，後面接筆記（例如翻譯、詞性、例句）。新字會直接進入複習佇列。</p>
        <textarea id="addBox" placeholder="apple 蘋果，常見水果&#10;ubiquitous 無所不在的"></textarea>
        <div class="add-row">
          <span class="toast-msg" id="addToast"></span>
          <button class="primary" id="addBtn">加入字卡</button>
        </div>
      </div>
      <input type="text" class="lib-search" id="searchBox" placeholder="搜尋單字或筆記…" value="${escapeHtml(searchTerm)}">
      <ul class="catalog">${listHtml}</ul>
    `;

    document.getElementById('addBtn').onclick = async () => {
      const raw = document.getElementById('addBox').value;
      if(!raw.trim()) return;
      const {added, skipped, merged} = parseAndAdd(raw);
      await saveWords();
      document.getElementById('addBox').value = '';
      document.getElementById('addToast').textContent = `已加入 ${added} 張${merged ? `，合併 ${merged} 行補充筆記` : ''}${skipped ? `，略過 ${skipped} 個重複` : ''}`;
      reviewQueue = dueWords().sort(() => Math.random() - 0.5);
      currentIdx = 0; flipped = false;
      renderLibrary();
      renderTabs();
    };

    document.getElementById('searchBox').oninput = (e) => {
      searchTerm = e.target.value.toLowerCase();
      renderLibrary();
    };

    el.querySelectorAll('li.entry').forEach(li => {
      const id = li.dataset.id;
      li.querySelector('.entry-row').onclick = () => {
        openEntryId = (openEntryId === id) ? null : id;
        renderLibrary();
      };
      const delBtn = li.querySelector('[data-action="delete"]');
      if(delBtn) delBtn.onclick = async (e) => {
        e.stopPropagation();
        words = words.filter(w => w.id !== id);
        openEntryId = null;
        await saveWords();
        renderLibrary(); renderTabs();
      };
      const saveBtn = li.querySelector('[data-action="save"]');
      if(saveBtn) saveBtn.onclick = async (e) => {
        e.stopPropagation();
        const w = words.find(x => x.id === id);
        const wordVal = li.querySelector('[data-field="word"]').value.trim();
        const notesVal = li.querySelector('[data-field="notes"]').value.trim();
        const tagsVal = li.querySelector('[data-field="tags"]').value.trim();
        if(wordVal) w.word = wordVal;
        w.notes = notesVal;
        w.tags = tagsVal ? tagsVal.split(',').map(t=>t.trim()).filter(Boolean) : [];
        openEntryId = null;
        await saveWords();
        renderLibrary(); renderTabs();
      };
    });
  }

  // ---------- Tabs ----------
  const tabReview = document.getElementById('tabReview');
  const tabLibrary = document.getElementById('tabLibrary');
  const viewReview = document.getElementById('viewReview');
  const viewLibrary = document.getElementById('viewLibrary');

  tabReview.onclick = () => {
    tabReview.classList.add('active'); tabLibrary.classList.remove('active');
    viewReview.style.display = ''; viewLibrary.style.display = 'none';
    startReviewSession();
  };
  tabLibrary.onclick = () => {
    tabLibrary.classList.add('active'); tabReview.classList.remove('active');
    viewLibrary.style.display = ''; viewReview.style.display = 'none';
    renderLibrary();
  };

  // ---------- Init ----------
  (async function init(){
    await loadWords();
    renderTabs();
    startReviewSession();
  })();
})();
</script>
</body>
</html>
